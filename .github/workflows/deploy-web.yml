name: Deploy webbapp (Pages)

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checka ut koden
        uses: actions/checkout@v4

      - name: Konfigurera Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Ladda upp webb-mappen
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploya till Pages
        id: deployment
        uses: actions/deploy-pages@v4
